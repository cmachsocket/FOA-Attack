# Saliency Attack Configuration
# 显著性抑制重建攻击配置文件

model:
  # 骨干网络选择：L336, B16, B32, Laion
  
  backbone: ["B16", "B32", "Laion"]  # Use all models in ensemble
  
  # 是否使用集成（建议开启）
  ensemble: true
  
  # 设备
  device: cuda
  
  # 输入分辨率
  input_res: 224
  
  # 是否使用随机裁剪（建议开启）
  use_source_crop: true
  use_target_crop: true
  
  # 裁剪 scale
  crop_scale: [0.6, 0.9] 
  
  # ========== Saliency Attack 专用参数 ==========
  
  # 显著性损失版本: v1 (基础), v2 (注意力), v3 (多层抑制),
  #   semantic_distance (语义距离自适应 alpha), v4a (PCA子空间抑制+加法重建)
  saliency_loss_version: v4a
  
  # 显著性比例：抑制前 X% 高显著区域（仅 v1/v2/semantic_distance 使用）
  saliency_ratio: 1
  
  # ========== v3 / v4a 多层级 mask 参数 ==========
  # top X% 为高显著（high），下一个 X% 为中显著（mid），其余为低显著（low）
  high_ratio: 0.1      # top 10% 为高显著
  mid_ratio: 0.2       # 10%-30% 为中显著（按累加值理解）
  high_alpha: 1.2      # 高显著 loss 权重倍数
  mid_alpha: 1.0       # 中显著 loss 权重倍数
  low_alpha: 0.5       # 低显著 loss 权重倍数
  
  # ========== v4a 独有参数（PCA子空间抑制+加法重建）==========
  pca_k: 64            # PCA 保留维度（surrogate 判别子空间维度）
  suppress_scale: 1.0  # 抑制强度（src 沿 PCA 子空间减弱的倍数）
  reconstruct_scale: 1.0  # 重建强度（tgt 沿 PCA 子空间加强的倍数）

  
  # 语义距离加权的 base alpha（仅 semantic_distance 版本使用）
  base_alpha: 1.2
  sigmoid_scale: 5.0
  
  # EMA 平滑系数（仅 semantic_distance 版本使用）
  # 越小越敏感（接近原始值），越大越平滑（惯性更强）
  ema_beta: 0.9


data:
  output: "./foa_attack_output"
  cle_data_path: "resources/images/bigscale"
  tgt_data_path: "resources/images/target_images"
  
  # batch size（建议 1）
  batch_size: 1
  
  # 总样本数（设为 -1 处理全部）
  num_samples: 100


attack:
  # 攻击类型: fgsm, mifgsm, pgd
  type: fgsm


optim:
  # 扰动上界（像素值 0-255）
  epsilon: 16
  
  # 步长
  alpha: 1.0
  
  # 迭代步数
  steps: 300

blackbox:
  model_name: "qwen3.5-9B"  # 可选 gpt4o, claude, gemini, gpt_4v, llava

wandb:
  project: foa-saliency-attack
  entity: null

# it isn't actually used, just for record
